[project]
name = "wheels"
version = "0.1.0"
description = "Wheel strategy helper: put/call scanner, TUI, and trade journal"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=1.2.0",
    "textual>=8.2.0",
    "textual-plotext>=1.0.0",
]

[project.scripts]
wheel = "wheel.cli:main"

[dependency-groups]
dev = [
    "pyflakes>=4.1.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wheel"]
# the web UI ships static assets next to server.py; include them in any build
artifacts = ["wheel/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
