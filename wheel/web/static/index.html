<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheels</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">◎</span>
      <span class="brand-name">Wheels</span>
    </div>

    <nav id="nav">
      <button class="nav-item active" data-view="book">
        <span class="nav-key">B</span><span>Book</span>
      </button>
      <button class="nav-item" data-view="scan">
        <span class="nav-key">S</span><span>Scan</span>
      </button>
      <button class="nav-item" data-view="calls">
        <span class="nav-key">C</span><span>Calls</span>
      </button>
      <button class="nav-item" data-view="plan">
        <span class="nav-key">P</span><span>Plan</span>
      </button>
      <button class="nav-item" data-view="journal">
        <span class="nav-key">L</span><span>Ledger</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-key">,</span><span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="acct">
        <div class="acct-row">
          <span class="muted">Budget</span><span id="sb-budget">—</span>
        </div>
        <div class="acct-row">
          <span class="muted" title="cash + collateral + shares at the live price (at cost until quotes load)">Total</span><span id="sb-total">—</span>
        </div>
        <div class="acct-row">
          <span class="muted">Free</span><span id="sb-free">—</span>
        </div>
        <div class="acct-row">
          <span class="muted">Premium</span><span id="sb-prem">—</span>
        </div>
        <div class="acct-row">
          <span class="muted">Realized</span><span id="sb-real">—</span>
        </div>
        <div class="meter"><div id="sb-meter"></div></div>
        <div class="acct-note" id="sb-note"></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="view-title">Book</h1>
        <p class="sub" id="view-sub"></p>
      </div>
      <div class="topbar-actions">
        <label class="toggle" id="project-toggle" hidden>
          <input type="checkbox" id="project-checkbox">
          <span>Project full budget</span>
        </label>
        <button class="btn" id="refresh-btn" title="Refetch quotes (R)">Refresh</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<div class="chat" id="chat">
  <button class="chat-bubble" id="chat-bubble" type="button" aria-expanded="false"
          aria-controls="chat-panel" aria-label="Ask the wheels agent" title="Ask the wheels agent">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 11.5a7.7 7.7 0 0 1-8 7.6 8.6 8.6 0 0 1-3.2-.6L4 20.5l1.7-4a7.4 7.4 0 0 1-1.7-4.6A7.7 7.7 0 0 1 12 4.3a7.7 7.7 0 0 1 8.5 7.2Z"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </button>

  <section class="chat-panel" id="chat-panel" hidden aria-label="Wheels agent chat">
    <header class="chat-head">
      <div class="chat-ident">
        <span class="chat-avatar">◎</span>
        <div>
          <div class="chat-title">Wheels agent</div>
          <div class="chat-sub" id="chat-sub">same engine as the screens</div>
        </div>
      </div>
      <div class="chat-head-actions">
        <button class="chat-icon" id="chat-new" type="button" title="New conversation">＋</button>
        <button class="chat-icon" id="chat-close" type="button" title="Close (Esc)" aria-label="Close chat">×</button>
      </div>
    </header>

    <div class="chat-log" id="chat-log" aria-live="polite"></div>

    <form class="chat-compose" id="chat-form">
      <textarea id="chat-input" rows="1" placeholder="Ask about your book, a ticker, a trade…"
                aria-label="Message the wheels agent" autocomplete="off"></textarea>
      <button class="chat-send" id="chat-send" type="submit" title="Send (Enter)" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <div class="chat-foot">Wheel book only · read-only · not financial advice</div>
  </section>
</div>

<script src="app.js"></script>
<script src="views.js"></script>
<script src="modals.js"></script>
<script src="chat.js"></script>
</body>
</html>
